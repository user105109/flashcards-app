<div class="grid grid-cols-3 gap-3 pt-2">
  <button (click)="previousCard()"
          class="flex items-center justify-center px-3 py-2.5 text-sm font-medium text-slate-600 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 active:bg-slate-100 transition shadow-sm cursor-pointer">
    Previous
  </button>

  <button (click)="showOrHideAnswerClick()"
          class="flex items-center justify-center px-3 py-2.5 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 active:bg-indigo-800 transition shadow-sm shadow-indigo-100 text-center whitespace-nowrap cursor-pointer">
    {{ showOrHideText }}
  </button>

  <button (click)="nextCard()"
          class="flex items-center justify-center px-3 py-2.5 text-sm font-medium text-slate-600 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 active:bg-slate-100 transition shadow-sm cursor-pointer">
    Next
  </button>
</div>
