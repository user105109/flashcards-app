<div class="space-y-2">
  <div class="flex justify-between items-baseline text-sm font-medium text-slate-500">
    <label for="file" class="text-xs uppercase tracking-wider text-slate-400">Cards Progress</label>
    <span class="bg-slate-100 px-2.5 py-0.5 rounded-full text-xs font-semibold text-slate-600">
      {{ progress }}/{{ totalCards }}
    </span>
  </div>

  <progress
    id="file"
    [max]="totalCards"
    [value]="progress"
    class="w-full h-2 rounded-full overflow-hidden block [&::-webkit-progress-bar]:bg-slate-100 [&::-webkit-progress-value]:bg-indigo-600 [&::-webkit-progress-value]:transition-all [&::-webkit-progress-value]:duration-300 [&::-moz-progress-bar]:bg-indigo-600">
    {{ progress }}
  </progress>
</div>
